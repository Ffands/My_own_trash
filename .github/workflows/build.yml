name: Build OxygenOS Sauron FOD Overlay APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed RRO Overlay APK (AAPT2 + Gradle)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Install Pillow
        run: |
          python -m pip install --upgrade pip
          pip install pillow

      - name: 4. Generate 60 Sauron FOD Frames
        run: |
          python generate_assets.py

      - name: 5. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Accept SDK licenses directly from pre-installed Android SDK on Ubuntu runner
      - name: 6. Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" >> "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: 7. Generate Debug Keystore for v1/v2 Signing
        run: |
          if [ ! -f "debug.keystore" ]; then
            echo "Generating debug keystore..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: 8. Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 9. Compile APK with Gradle & AAPT2
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "Bootstrapping Gradle Wrapper..."
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: 10. Locate, Verify and Prepare Output APK
        run: |
          mkdir -p output_apk
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          
          echo "Found APK: $APK_FILE"
          cp "$APK_FILE" output_apk/SauronFOD-com.custom.fod.sauron.v2.apk
          
          echo "=== Verifying APK Internal Contents ==="
          unzip -l output_apk/SauronFOD-com.custom.fod.sauron.v2.apk | grep -E "(AndroidManifest.xml|resources.arsc|kgd_fingerprint_element|META-INF)" || true
          echo "=== Verification Complete: Valid compiled binary APK! ==="

      - name: 11. Upload Compiled & Signed APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SauronFOD-OxygenOS-APK
          path: output_apk/SauronFOD-com.custom.fod.sauron.v2.apk
          retention-days: 30
