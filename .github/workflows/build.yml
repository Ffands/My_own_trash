name: Build OxygenOS Sauron FOD Overlay APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Autonomous FOD Asset Generation & APK Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow
        run: |
          python -m pip install --upgrade pip
          pip install pillow

      - name: Generate Sauron FOD Assets (60 Frames, Icons, Sound)
        run: |
          python generate_assets.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Debug Keystore for Signing
        run: |
          if [ ! -f "debug.keystore" ]; then
            echo "Generating debug keystore..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build RRO Overlay APK
        run: |
          chmod +x gradlew || gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Locate and Prepare Output APK
        run: |
          mkdir -p output_apk
          find app/build/outputs/apk -name "*.apk" -exec cp {} output_apk/SauronFOD-OxygenOS-signed.apk \;
          ls -la output_apk/

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SauronFOD-OxygenOS-APK
          path: output_apk/SauronFOD-OxygenOS-signed.apk
          retention-days: 30
